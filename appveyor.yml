version: '#{build}-{branch}'
image: Visual Studio 2015

configuration: Release

environment:
  matrix:
    - PlatformToolset: v140_xp

# One job, not a `platform:` matrix: a matrix means one signing login per job. See ci/SIGNING.md.
# /logger is what the built-in `build:` step gave us - warnings and errors on the Messages tab.
build_script:
  - cmd: msbuild MemView.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"
  - cmd: msbuild MemView.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal /logger:"C:\Program Files\AppVeyor\BuildAgent\Appveyor.MSBuildLogger.dll"

after_build:
  # Sign before zipping. No-op on non-tag builds. See ci/SIGNING.md.
  - ps: .\ci\appveyor-sign.ps1 -Path "bin\MemView-x86.exe", "bin\MemView-x64.exe"

  # Absolute paths, so 7z stores bare filenames.
  - cmd: >-
      7z a MemView-x86.zip
      %APPVEYOR_BUILD_FOLDER%\bin\MemView-x86.exe %APPVEYOR_BUILD_FOLDER%\bin\MemView-x86.pdb
  - cmd: >-
      7z a MemView-x64.zip
      %APPVEYOR_BUILD_FOLDER%\bin\MemView-x64.exe %APPVEYOR_BUILD_FOLDER%\bin\MemView-x64.pdb

test: off

artifacts:
  - path: MemView-x86.zip
    name: MemView-x86
  - path: MemView-x64.zip
    name: MemView-x64

skip_commits:
  files:
    - docs/*
    - '**/*.html'

deploy:
  - provider: GitHub
    # Padlocked variables in the AppVeyor project settings; SIGNING_NOTES is set by ci/signing-status.ps1.
    auth_token: $(GITHUB_AUTH_TOKEN)
    description: $(SIGNING_NOTES)
    draft: true
    on:
      APPVEYOR_REPO_TAG: true
